name: AlphaGoldMonitor
options:
  bundleIdPrefix: com.alphagold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AlphaGoldMonitor:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - README.md
          - project.yml
          - setup_xcode.sh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alphagold.frontend
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0.1
        DEVELOPMENT_TEAM: ""
    info:
      path: Info.plist
      properties:
        NSBonjourServices:
          - _http._tcp
        NSLocalNetworkUsageDescription: AlphaGold connects to your Mac mini on your network to show live trading signals and trades.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            192.168.0.4:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            123.203.51.164:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
